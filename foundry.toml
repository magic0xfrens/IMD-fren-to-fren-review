# Fren Review export of magic0xfrens/Magic-Internet-Frens@6f70ad6a7697.
# The DEFAULT profile is the source repo's `cauldron` profile, so a plain `forge build` works.
# `render` builds the on-chain art (art cluster): FOUNDRY_PROFILE=render forge build.

[profile.default]
src = "."
out = "out"
libs = [
    "lib",
]
auto_detect_solc = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 1
via_ir = true
ignored_error_codes = [
    "license",
    "code-size",
]
fs_permissions = [
    { access = "read", path = "./render/badge-art" },
    { access = "read", path = "./out" },
]
skip = [
    "lib/**/test/**",
    "lib/**/src/test/**",
    "lib/**/mocks/**",
    "lib/**/fv/**",
    "lib/**/certora/**",
    "lib/v4-periphery/lib/permit2/script/**",
    "MagicFrensPeg.sol",
    "MagicFrensPresale.sol",
    "deploy/DeployMagicFrensPeg.s.sol",
    "deploy/DeployPresale.s.sol",
    "deploy/DeployRenderer.s.sol",
    "test/MagicFrensPresale.t.sol",
    "test/FrenRenderer.t.sol",
    "render/**",
    "reference/**",
    "tools/**",
]

[profile.render]
src = "."
out = "out"
libs = [
    "lib",
]
auto_detect_solc = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
ignored_error_codes = [
    "license",
    "code-size",
]
fs_permissions = [
    { access = "read", path = "./render/badge-art" },
]
skip = [
    "lib/openzeppelin-contracts/fv/**",
    "lib/openzeppelin-contracts/certora/**",
    "lib/openzeppelin-contracts/test/**",
    "lib/openzeppelin-contracts/contracts/mocks/**",
    "lib/v4-periphery/**",
    "lib/v4-core/**",
    "vendor/**",
    "MagicFrensPeg.sol",
    "MagicFrensPresale.sol",
    "CauldronRegistry.sol",
    "CauldronHook.sol",
    "CauldronToken.sol",
    "deploy/DeployMagicFrensPeg.s.sol",
    "deploy/DeployPresale.s.sol",
    "deploy/DeployCauldron.s.sol",
    "test/MagicFrensPresale.t.sol",
    "test/CauldronSummon.t.sol",
    "reference/**",
    "tools/**",
]
